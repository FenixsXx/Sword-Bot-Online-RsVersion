<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Game Night Live</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f7fb;
      background: transparent;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background:
        radial-gradient(ellipse at 15% 0%, rgb(88 101 242 / 24%), transparent 50%),
        linear-gradient(145deg, rgb(20 22 32 / 96%), rgb(31 34 48 / 92%));
    }

    .shell {
      width: min(100%, 1500px);
      margin: 0 auto;
      padding: 26px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 24px;
      background: rgb(26 28 40 / 88%);
      box-shadow: 0 24px 80px rgb(0 0 0 / 35%);
      backdrop-filter: blur(18px);
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 { margin: 0; font-size: clamp(1.5rem, 3vw, 2.4rem); letter-spacing: .02em; }
    .subtitle { margin: 7px 0 0; color: #b7bbca; }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgb(255 255 255 / 13%);
      border-radius: 999px;
      background: rgb(255 255 255 / 5%);
      color: #d3d6e2;
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #85899a;
      box-shadow: 0 0 0 4px rgb(133 137 154 / 15%);
    }

    .live-badge.active { color: #a7f3c5; }
    .live-badge.active .live-dot {
      background: #35df82;
      box-shadow: 0 0 0 4px rgb(53 223 130 / 17%), 0 0 16px #35df82;
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(200px, 260px);
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-card {
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid rgb(255 255 255 / 9%);
      border-radius: 15px;
      background: rgb(255 255 255 / 4%);
    }

    .summary-label {
      display: block;
      margin-bottom: 4px;
      color: #aeb3c3;
      font-size: .73rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .summary-value {
      overflow: hidden;
      font-size: 1rem;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .speaker {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 74px;
      margin-bottom: 18px;
      padding: 12px 16px;
      border: 1px solid rgb(53 223 130 / 40%);
      border-radius: 16px;
      background: linear-gradient(90deg, rgb(53 223 130 / 12%), rgb(255 255 255 / 3%));
      box-shadow: 0 0 24px rgb(53 223 130 / 10%);
    }

    .speaker[hidden] { display: none; }
    .speaker img { width: 46px; height: 46px; border-radius: 50%; }
    .speaker small { display: block; color: #8af0b4; font-weight: 800; letter-spacing: .1em; }
    .speaker strong { display: block; margin-top: 3px; font-size: 1.05rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 14px;
    }

    .participant {
      position: relative;
      display: flex;
      min-height: 232px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 14px 15px;
      border: 1px solid rgb(255 255 255 / 10%);
      border-radius: 18px;
      background: linear-gradient(160deg, rgb(255 255 255 / 7%), rgb(255 255 255 / 2%));
      text-align: center;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .participant.speaking {
      z-index: 1;
      transform: scale(1.035);
      border-color: #35df82;
      box-shadow: 0 0 0 1px rgb(53 223 130 / 32%), 0 0 28px rgb(53 223 130 / 24%);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    .participant.primary { min-height: 260px; }

    .avatar-wrap {
      position: relative;
      margin-bottom: 13px;
    }

    .avatar {
      display: block;
      width: 94px;
      height: 94px;
      border: 3px solid rgb(255 255 255 / 18%);
      border-radius: 50%;
      object-fit: cover;
    }

    .speaking .avatar {
      border-color: #35df82;
      box-shadow: 0 0 18px rgb(53 223 130 / 42%);
    }

    .volume {
      position: absolute;
      right: -6px;
      bottom: 1px;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 2px solid #252838;
      border-radius: 50%;
      background: #45495a;
      font-size: .8rem;
    }

    .speaking .volume { background: #168d4c; }
    .meter {
      width: 76px;
      height: 5px;
      margin-top: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: rgb(255 255 255 / 12%);
    }

    .meter-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #35df82;
      transition: width 100ms linear;
    }

    .participant-name { width: 100%; overflow-wrap: anywhere; font-size: 1.04rem; font-weight: 800; }
    .participant-level { margin-top: 5px; color: #f2d783; font-size: .85rem; font-weight: 700; }
    .participant-stats { margin-top: 8px; color: #aeb3c3; font-size: .8rem; }
    .empty { padding: 52px 16px; color: #b7bbca; text-align: center; }
    .footer { margin-top: 20px; color: #85899a; font-size: .75rem; text-align: right; }

    @keyframes pulse {
      from { box-shadow: 0 0 0 1px rgb(53 223 130 / 26%), 0 0 18px rgb(53 223 130 / 15%); }
      to { box-shadow: 0 0 0 1px rgb(53 223 130 / 42%), 0 0 32px rgb(53 223 130 / 30%); }
    }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .shell { padding: 17px; border-radius: 18px; }
      header { align-items: flex-start; }
      .summary { grid-template-columns: minmax(0, 1fr); }
      .grid { grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px; }
      .participant { min-height: 200px; padding: 14px 10px; }
      .avatar { width: 76px; height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    html[data-theme="podcast"] body { background: transparent; padding: 18px; }
    html[data-theme="podcast"] .shell {
      display: grid;
      grid-template-columns: minmax(250px, .75fr) minmax(0, 2fr);
      gap: 18px;
      background: rgb(18 20 28 / 94%);
    }
    html[data-theme="podcast"] header,
    html[data-theme="podcast"] .summary,
    html[data-theme="podcast"] .footer { grid-column: 1 / -1; }
    html[data-theme="podcast"] .speaker {
      min-height: 260px;
      margin: 0;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    html[data-theme="podcast"] .speaker img { width: 110px; height: 110px; }
    html[data-theme="podcast"] .grid { grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); }
    html[data-theme="podcast"] .participant { min-height: 170px; }
    html[data-theme="podcast"] .avatar { width: 70px; height: 70px; }

    html[data-theme="esport"] body {
      background: radial-gradient(ellipse at 80% 0%, rgb(235 69 158 / 22%), transparent 50%),
        linear-gradient(145deg, #100e20, #17132b);
    }
    html[data-theme="esport"] .shell { border-color: rgb(235 69 158 / 35%); }
    html[data-theme="esport"] .participant { border-radius: 8px; }
    html[data-theme="esport"] .participant.speaking {
      border-color: #eb459e;
      box-shadow: 0 0 24px rgb(235 69 158 / 30%);
    }
    html[data-theme="esport"] .speaking .avatar,
    html[data-theme="esport"] .meter-fill { border-color: #eb459e; background: #eb459e; }
    html[data-theme="esport"] .speaker {
      border-color: rgb(235 69 158 / 50%);
      background: linear-gradient(90deg, rgb(235 69 158 / 15%), rgb(255 255 255 / 3%));
    }

    html[data-theme="minimal"] body { padding: 12px; background: transparent; }
    html[data-theme="minimal"] .shell {
      padding: 14px;
      border: 0;
      border-radius: 0;
      background: rgb(16 18 24 / 76%);
      box-shadow: none;
      backdrop-filter: none;
    }
    html[data-theme="minimal"] .summary { grid-template-columns: minmax(0, 1fr); }
    html[data-theme="minimal"] .participant {
      min-height: 150px;
      padding: 12px;
      border-radius: 12px;
      background: rgb(16 18 24 / 65%);
    }
    html[data-theme="minimal"] .avatar { width: 68px; height: 68px; }
    html[data-theme="minimal"] .participant-stats,
    html[data-theme="minimal"] .footer { display: none; }

    html[data-theme="stage"] body { padding: 16px; background: transparent; }
    html[data-theme="stage"] .shell { background: rgb(20 22 32 / 90%); }
    html[data-theme="stage"] .speaker {
      min-height: 180px;
      justify-content: center;
      border-width: 2px;
    }
    html[data-theme="stage"] .speaker img { width: 100px; height: 100px; }
    html[data-theme="stage"] .grid { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
    html[data-theme="stage"] .participant { min-height: 160px; }
    html[data-theme="stage"] .avatar { width: 68px; height: 68px; }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>🎮 GAME NIGHT</h1>
        <p class="subtitle" id="channel">In attesa dell'evento…</p>
      </div>
      <div class="live-badge" id="connection"><span class="live-dot"></span><span id="connection-text">CONNESSIONE</span></div>
    </header>

    <section class="summary" aria-label="Statistiche evento">
      <div class="summary-card">
        <span class="summary-label">👥 Partecipanti</span>
        <span class="summary-value" id="count">0</span>
      </div>
    </section>

    <section class="speaker" id="speaker" hidden aria-live="polite">
      <img id="speaker-avatar" alt="">
      <div><small>🎤 SPEAKER PRINCIPALE</small><strong id="speaker-name"></strong></div>
    </section>

    <section class="grid" id="participants" aria-live="polite"></section>
    <div class="empty" id="empty">Gli avatar appariranno quando i membri entrano nel vocale.</div>
    <div class="footer">L'indicatore speaker è stimato dai pacchetti audio in tempo reale.</div>
  </main>

  <script>
    (() => {
      const themes = new Set(["classic", "podcast", "esport", "minimal", "stage"]);
      const requestedTheme = new URLSearchParams(window.location.search).get("tema");
      document.documentElement.dataset.theme = themes.has(requestedTheme) ? requestedTheme : "classic";
      const guildId = window.location.pathname.split("/").filter(Boolean).at(-1);
      const token = window.location.hash.slice(1);
      const cards = document.getElementById("participants");
      const connection = document.getElementById("connection");
      const connectionText = document.getElementById("connection-text");
      const speakerPanel = document.getElementById("speaker");
      const empty = document.getElementById("empty");

      window.history.replaceState(null, "", window.location.pathname);

      function setConnection(isActive, text) {
        connection.classList.toggle("active", isActive);
        connectionText.textContent = text;
      }

      function createParticipant(member, primaryId) {
        const card = document.createElement("article");
        card.className = "participant";
        if (member.speaking) card.classList.add("speaking");
        if (member.id === primaryId) card.classList.add("primary");

        const avatarWrap = document.createElement("div");
        avatarWrap.className = "avatar-wrap";
        const avatar = document.createElement("img");
        avatar.className = "avatar";
        avatar.src = member.avatar;
        avatar.alt = `Avatar di ${member.name}`;
        avatar.referrerPolicy = "no-referrer";
        const volume = document.createElement("span");
        volume.className = "volume";
        volume.setAttribute("aria-label", member.speaking ? "Sta parlando" : "Non sta parlando");
        volume.textContent = member.speaking ? "🎤" : "🔇";
        const meter = document.createElement("span");
        meter.className = "meter";
        const meterFill = document.createElement("span");
        meterFill.className = "meter-fill";
        meterFill.style.width = `${Math.min(100, Math.round(member.volume * 400))}%`;
        meter.append(meterFill);
        avatarWrap.append(avatar, volume, meter);

        const name = document.createElement("div");
        name.className = "participant-name";
        name.textContent = member.name;
        const level = document.createElement("div");
        level.className = "participant-level";
        level.textContent = member.level;
        const stats = document.createElement("div");
        stats.className = "participant-stats";
        stats.textContent = `🔥 ${member.streak} sett. · 🏆 ${member.wins} vittorie`;
        card.append(avatarWrap, name, level, stats);
        return card;
      }

      function render(state) {
        setConnection(Boolean(state.active), state.active ? "LIVE" : "TERMINATO");
        if (!state.active) {
          document.getElementById("channel").textContent = "Evento terminato";
          speakerPanel.hidden = true;
          cards.replaceChildren();
          empty.hidden = false;
          empty.textContent = "L'evento è terminato. Il bot ha lasciato il canale vocale.";
          return;
        }

        document.getElementById("channel").textContent = `🔊 ${state.channel}`;
        document.getElementById("count").textContent = String(state.participant_count);
        const speaker = state.participants.find((member) => member.id === state.main_speaker_id);
        speakerPanel.hidden = !speaker;
        if (speaker) {
          document.getElementById("speaker-avatar").src = speaker.avatar;
          document.getElementById("speaker-name").textContent = speaker.name;
        }
        cards.replaceChildren(...state.participants.map((member) => createParticipant(member, state.main_speaker_id)));
        empty.hidden = state.participants.length > 0;
      }

      if (!token || !guildId) {
        setConnection(false, "LINK NON VALIDO");
        empty.textContent = "Link overlay non valido. Chiedi allo staff un link aggiornato.";
        return;
      }

      const scheme = window.location.protocol === "https:" ? "wss:" : "ws:";
      let retry = 0;
      let eventEnded = false;

      function connect() {
        const socket = new WebSocket(`${scheme}//${window.location.host}/ws/${encodeURIComponent(guildId)}`);
        socket.addEventListener("open", () => {
          retry = 0;
          socket.send(JSON.stringify({ token }));
        });
        socket.addEventListener("message", (event) => {
          try {
            const state = JSON.parse(event.data);
            if (!state.active) eventEnded = true;
            render(state);
          } catch {
            setConnection(false, "DATI NON VALIDI");
          }
        });
        socket.addEventListener("close", (event) => {
          if (event.code === 1008) {
            setConnection(false, "LINK NON VALIDO");
            return;
          }
          if (event.code === 1000 || eventEnded) {
            setConnection(false, "TERMINATO");
            return;
          }
          setConnection(false, "RICONNESSIONE…");
          window.setTimeout(connect, Math.min(10000, 500 * 2 ** retry++));
        });
        socket.addEventListener("error", () => setConnection(false, "ERRORE"));
      }

      connect();
    })();
  </script>
</body>
</html>
