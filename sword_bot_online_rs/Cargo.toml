[package]
name = "sword_bot_online_rs"
version = "0.1.0"
edition = "2024"
default-run = "sword_bot_online_rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
fernet ={ version = "0.2.2", default-features = false, features = ["rustcrypto"] }
hmac = "0.13.0"
poise = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "serenity", "rustls", "tungstenite", "receive"] }
rusqlite = { version = "0.41.1", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

tokio-tungstenite = "0.29.0"
futures-util = "0.3.34"
